---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-xfs
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "3"
  dataLocality: "disabled"
  staleReplicaTimeout: "1440" # 48 hours in minutes
  fsType: "xfs"
reclaimPolicy: "Delete"
volumeBindingMode: "Immediate"
